name: gtg
on:
  workflow_dispatch:
    inputs:
      mode:
        description: probe | build
        default: probe
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: probe
        if: ${{ inputs.mode == 'probe' }}
        run: |
          D=$(date -u +%Y%m%d); Y=$(date -u -d yesterday +%Y%m%d)
          for u in https://nomads.ncep.noaa.gov/pub/data/nccf/com/wafs/prod/ https://nomads.ncep.noaa.gov/ ; do echo "== $u"; curl -sS -m 30 -o /tmp/o -w '%{http_code}\n' "$u" || true; head -c 400 /tmp/o; echo; done
          for b in noaa-gfs-bdp-pds noaa-wafs-pds noaa-nws-wafs-pds; do echo "== s3 $b"; curl -sS -m 30 "https://$b.s3.amazonaws.com/?list-type=2&max-keys=20&delimiter=/" | head -c 1200; echo; done
          echo "== gfs atmos list"; curl -sS -m 30 "https://noaa-gfs-bdp-pds.s3.amazonaws.com/?list-type=2&prefix=gfs.$Y/00/&delimiter=/" | grep -o '<Prefix>[^<]*</Prefix>' | head
          curl -sS -m 30 "https://noaa-gfs-bdp-pds.s3.amazonaws.com/?list-type=2&prefix=gfs.$Y/00/atmos/&max-keys=1000" | grep -o '<Key>[^<]*wafs[^<]*</Key>' | head -40
          curl -sS -m 30 "https://noaa-gfs-bdp-pds.s3.amazonaws.com/?list-type=2&prefix=gfs.$Y/00/wafs/&max-keys=60" | grep -o '<Key>[^<]*</Key>' | head -60
