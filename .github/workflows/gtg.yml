name: gtg
on:
  workflow_dispatch:
    inputs:
      mode:
        description: probe | build
        default: probe
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: probe
        if: ${{ inputs.mode == 'probe' }}
        run: |
          D=$(date -u +%Y%m%d); Y=$(date -u -d yesterday +%Y%m%d)
          echo "== nco scripts"; for f in jobs/JWAFS_GRIB2_0P25_BLENDING jobs/JWAFS_GRIB2_0P25 scripts/exwafs_grib2_0p25_blending.sh scripts/exwafs_grib2_0p25.sh; do echo "--- $f"; curl -sS -m 30 https://www.nco.ncep.noaa.gov/pmb/codes/nwprod/wafs.v7.0.2/$f | grep -iE 'COMOUT|COMIN|grib2|blended|unblended|awf|\.grib2' | head -25; done
          B=https://nomads.ncep.noaa.gov/pub/data/nccf/com/wafs/prod
          for DD in $D $Y; do for H in 00 06 12 18; do for u in "wafs.$DD/$H/grib2/0p25/blending/WAFS_0p25_blended_${DD}${H}f012.grib2" "wafs.$DD/$H/grib2/0p25/WAFS_0p25_unblended_${DD}${H}f012.grib2" "wafs.$DD/$H/grib2/0p25/gfs.t${H}z.awf_0p25.f012.grib2" "wafs.$DD/$H/grib2/0p25/blending/" "wafs.$DD/$H/"; do echo "$(curl -s -I -m 20 -o /dev/null -w '%{http_code} %{size_download}' $B/$u) $u"; done; done; done
          echo "== cgi"; curl -s -m 20 -o /dev/null -w '%{http_code}\n' "https://nomads.ncep.noaa.gov/cgi-bin/filter_wafs_0p25.pl"; curl -s -m 20 https://nomads.ncep.noaa.gov/ | grep -io 'wafs[^"<]*' | sort -u | head -20
