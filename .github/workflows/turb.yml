name: turb
on:
  schedule:
    - cron: '40 8 * * *'
    - cron: '40 20 * * *'
  workflow_dispatch:
    inputs:
      s0: {default: '0'}
      s1: {default: '60'}
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q eccodes cfgrib xarray numpy
      - run: S0=${{ inputs.s0 || '0' }} S1=${{ inputs.s1 || '60' }} python3 turb/build.py
      - name: publish to turb branch
        run: |
          cd out && git init -q && git checkout -q -b turb && git add -A
          git -c user.name=bot -c user.email=bot@users.noreply.github.com commit -qm "turb $(cat meta.json | head -c 120)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" turb
